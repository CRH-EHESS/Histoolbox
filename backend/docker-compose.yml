services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dans Docker Compose, Redis est accessible via le nom de service "redis".
      # Cette valeur peut être surchargée dans .env si besoin.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Base SQLite dans le volume ./data : partagée avec rq_worker et
      # conservée quand le conteneur est recréé.
      - HISTOOLBOX_DB_PATH=${HISTOOLBOX_DB_PATH:-/app/data/tasks.db}
    depends_on:
      - redis
    volumes:
      # Persistance SQLite + fichiers OCR entre les redémarrages
      - ./data:/app/data
    expose:
      - "8001"

  rq_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - HISTOOLBOX_DB_PATH=${HISTOOLBOX_DB_PATH:-/app/data/tasks.db}
    command: ["uv", "run", "python", "run_worker.py"]
    depends_on:
      - redis
      - api
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  redis_data:
  caddy_data:
  caddy_config:
